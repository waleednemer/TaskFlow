
services:
  web:
    image: waleednemer/taskflow:latest
    container_name: taskflow_web
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    command:
      - sh
      - -c
      - flask --app wsgi init-db && exec gunicorn --chdir /app/backend --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile - wsgi:app

  db:
    image: postgres:16-alpine
    container_name: taskflow_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
