<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 16l5 5 9-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ Auth ============ -->
<section id="auth-view" class="auth" hidden>
  <div class="auth-card">
    <div class="brand"><span class="logo">✓</span><span>TaskFlow</span></div>
    <p class="muted" data-i18n="tagline"></p>
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="login" data-i18n="login"></button>
      <button type="button" class="tab" data-tab="register" data-i18n="register"></button>
    </div>

    <form id="login-form" class="form" novalidate>
      <label><span data-i18n="email"></span><input name="email" type="email" autocomplete="email" required></label>
      <label><span data-i18n="password"></span><input name="password" type="password" autocomplete="current-password" required></label>
      <p class="form-error" role="alert"></p>
      <button class="btn primary block" type="submit" data-i18n="login"></button>
    </form>

    <form id="register-form" class="form" hidden novalidate>
      <label><span data-i18n="name"></span><input name="name" autocomplete="name" maxlength="100" required></label>
      <label><span data-i18n="email"></span><input name="email" type="email" autocomplete="email" required></label>
      <label><span data-i18n="password"></span><input name="password" type="password" autocomplete="new-password" minlength="8" required>
        <small class="muted" data-i18n="password_hint"></small></label>
      <p class="form-error" role="alert"></p>
      <button class="btn primary block" type="submit" data-i18n="register"></button>
    </form>

    <div class="auth-tools">
      <button type="button" class="btn ghost" data-action="toggle-lang"></button>
      <button type="button" class="btn ghost" data-action="toggle-theme" data-i18n="theme"></button>
    </div>
  </div>
</section>

<!-- ============ App ============ -->
<div id="app-view" class="shell" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">✓</span><span>TaskFlow</span></div>
    <nav>
      <button class="nav-item" data-view="dashboard"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/></svg><span data-i18n="nav_dashboard"></span></button>
      <button class="nav-item" data-view="tasks"><svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg><span data-i18n="nav_tasks"></span></button>
      <button class="nav-item" data-view="board"><svg viewBox="0 0 24 24"><path d="M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v6h-4z"/></svg><span data-i18n="nav_board"></span></button>
      <button class="nav-item" data-view="projects"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><span data-i18n="nav_projects"></span></button>
      <button class="nav-item" data-view="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg><span data-i18n="nav_profile"></span></button>
    </nav>
    <div class="sidebar-foot">
      <div class="user-card"><span class="avatar" id="user-avatar"></span>
        <div><strong id="user-name"></strong><small class="muted" id="user-email"></small></div></div>
      <button class="btn ghost block" data-action="logout" data-i18n="logout"></button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" data-action="menu" data-i18n-title="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="page-title"></h1>
      <div class="topbar-actions">
        <button class="btn ghost" data-action="toggle-lang"></button>
        <button class="icon-btn" data-action="toggle-theme" data-i18n-title="theme" aria-label="Theme"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
        <button class="btn primary" data-action="new-task"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="new_task"></span></button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<!-- ============ Dialogs ============ -->
<dialog id="task-dialog">
  <form id="task-form" class="form" novalidate>
    <h2 id="task-dialog-title"></h2>
    <label><span data-i18n="title"></span><input name="title" maxlength="200" required></label>
    <label><span data-i18n="description"></span><textarea name="description" rows="3" maxlength="5000"></textarea></label>
    <div class="grid-2">
      <label><span data-i18n="project"></span><select name="project_id"></select></label>
      <label><span data-i18n="due_date"></span><input name="due_date" type="date"></label>
      <label><span data-i18n="status"></span><select name="status"></select></label>
      <label><span data-i18n="priority"></span><select name="priority"></select></label>
    </div>
    <p class="form-error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" data-close data-i18n="cancel"></button>
      <button type="submit" class="btn primary" data-i18n="save"></button>
    </div>
  </form>
</dialog>

<dialog id="project-dialog">
  <form id="project-form" class="form" novalidate>
    <h2 id="project-dialog-title"></h2>
    <label><span data-i18n="name"></span><input name="name" maxlength="120" required></label>
    <label><span data-i18n="description"></span><textarea name="description" rows="3" maxlength="2000"></textarea></label>
    <label><span data-i18n="color"></span><input name="color" type="color" value="#4f46e5"></label>
    <p class="form-error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" data-close data-i18n="cancel"></button>
      <button type="submit" class="btn primary" data-i18n="save"></button>
    </div>
  </form>
</dialog>

<dialog id="confirm-dialog">
  <form method="dialog" class="form">
    <p id="confirm-msg"></p>
    <div class="dialog-actions">
      <button value="cancel" class="btn ghost" data-i18n="cancel"></button>
      <button value="ok" class="btn danger" data-i18n="delete"></button>
    </div>
  </form>
</dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
